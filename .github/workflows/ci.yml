# ==============================================
# CI Pipeline — HexaGroup
# ==============================================
# Pipeline ini berjalan otomatis saat:
# - Push ke branch main
# - Pull Request ke branch main
#
# Jobs:
# 1. test-backend: Install deps + run pytest
# 2. test-frontend: Install deps + run vitest
# 3. lint: Ruff untuk pengecekan kualitas kode backend
# 4. build-docker: Build Docker images (pastikan Dockerfile valid)

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================================
  # JOB 1: Test Backend (Python/FastAPI)
  # ================================
  test-backend:
    name: 🐍 Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run tests with coverage
        run: pytest

  # ================================
  # JOB 2: Test Frontend (React/Vitest)
  # ================================
  lint-letters-service:
    name: 🔍 Lint Letters Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Cek folder letters-service
        id: check_letters
        run: |
          if [ -d "services/letters-service" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ services/letters-service belum ada, di-skip"
          fi

      - name: 🐍 Setup Python
        if: steps.check_letters.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📥 Install ruff
        if: steps.check_letters.outputs.exists == 'true'
        run: pip install ruff

      - name: 🔍 Run Ruff Linter
        if: steps.check_letters.outputs.exists == 'true'
        working-directory: ./services/letters-service
        run: ruff check .

  # ================================
  # JOB 3: Lint Backend (Ruff)
  # ================================
  lint:
    name: 🔍 Lint Backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📥 Install ruff
        run: pip install ruff

      - name: 🔍 Run Ruff Linter
        run: ruff check .

  # ================================
  # JOB 4: Build Docker Images
  # ================================
  build-docker:
    name: 🐳 Build Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-backend, test-frontend, lint]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build backend image
        run: docker build -t sikasi-app-backend:ci ./backend

      - name: 🐳 Build frontend image
        run: docker build -t sikasi-app-frontend:ci ./frontend

      - name: ✅ Build success
        run: echo "✅ All Docker images built successfully!"

# ================================
  # JOB 5: Integration Tests
  # ================================
integration-test:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]   # Hanya jalan jika kedua job di atas berhasil

    steps:
      # 1. Ambil kode dari repository
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2. Jalankan semua services dengan Docker Compose
      - name: 🐳 Start all services
        run: docker compose up -d --build

      # 3. Tunggu sampai semua services benar-benar siap
      - name: ⏳ Wait for services to be ready
        run: |
          echo "Menunggu services siap..."
          sleep 15
          # Coba ping gateway sampai 5 kali, jeda 3 detik tiap percobaan
          curl --retry 5 --retry-delay 3 --retry-connrefused http://localhost/health
          echo "Services sudah siap!"

      # 4. Install dependency Python untuk testing
      - name: 📦 Install test dependencies
        run: pip install httpx pytest

      # 5. Jalankan integration tests
      - name: 🧪 Run integration tests
        run: pytest tests/integration/ -v

      # 6. Matikan semua services (selalu dijalankan, bahkan jika test gagal)
      - name: 🛑 Stop all services
        if: always()
        run: docker compose down -v
