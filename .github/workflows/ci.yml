# ==============================================
# CI Pipeline — HexaGroup (Microservices)
# ==============================================
# Pipeline ini berjalan otomatis saat:
# - Push ke branch main
# - Pull Request ke branch main
#
# Jobs yang berjalan:
# 1. test-auth-service    : Unit test Auth Service
# 2. test-finance-service : Unit test Finance Service
# 3. test-letters-service : Unit test Letters Service
# 4. lint-services        : Cek kualitas kode semua services (Ruff)
# 5. build-docker         : Build semua Docker images
# 6. integration-test     : Test komunikasi antar services (cross-service)
# ==============================================

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Batalkan pipeline lama jika ada push baru di branch yang sama
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ================================
  # JOB 1: Unit Test Auth Service
  # Menjalankan pytest di dalam folder services/auth-service
  # ================================
  test-auth-service:
    name: Test Auth Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./services/auth-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/auth-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v --tb=short
        continue-on-error: true  # Tidak gagalkan pipeline jika belum ada test

  # ================================
  # JOB 2: Unit Test Finance Service
  # Menjalankan pytest di dalam folder services/finance-service
  # ================================
  test-finance-service:
    name: Test Finance Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./services/finance-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/finance-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v --tb=short
        continue-on-error: true  # Tidak gagalkan pipeline jika belum ada test

  # ================================
  # JOB 3: Unit Test Letters Service
  # Menjalankan pytest di dalam folder services/letters-service
  # ================================
  test-letters-service:
    name: Test Letters Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./services/letters-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/letters-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v --tb=short
        continue-on-error: true  # Tidak gagalkan pipeline jika belum ada test

  # ================================
  # JOB 4: Lint Semua Services dengan Ruff
  # Ruff adalah linter Python yang cepat
  # Mengecek kualitas kode di semua services sekaligus
  # ================================
  lint-services:
    name: Lint All Services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/letters-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v --tb=short
        continue-on-error: true  # Tidak gagalkan pipeline jika belum ada test

      - name: Install ruff
        run: pip install ruff

      - name: Lint Auth Service
        run: ruff check ./services/auth-service
        continue-on-error: true  # Laporkan error tapi jangan stop pipeline

      - name: Lint Finance Service
        run: ruff check ./services/finance-service
        continue-on-error: true

      - name: Lint Letters Service
        run: ruff check ./services/letters-service
        continue-on-error: true

  # ================================
  # JOB 5: Build Docker Images
  # Memastikan semua Dockerfile valid dan bisa di-build
  # Baru jalan setelah semua test dan lint selesai (needs)
  # ================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-auth-service, test-finance-service, test-letters-service, lint-services]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Auth Service image
        run: docker build -t sikasi-auth-service:ci ./services/auth-service

      - name: Build Finance Service image
        run: docker build -t sikasi-finance-service:ci ./services/finance-service

      - name: Build Letters Service image
        run: docker build -t sikasi-letters-service:ci ./services/letters-service

      - name: Build Frontend image
        run: docker build -t sikasi-frontend:ci ./frontend
        continue-on-error: true  # Frontend build error tidak menghentikan pipeline

      - name: Build success
        run: echo "Semua Docker images berhasil di-build!"

  # ================================
  # JOB 6: Integration Tests
  # Menjalankan docker compose up untuk menjalankan semua services
  # terus menguji komunikasi antar services secara nyata
  # Baru jalan setelah build-docker berhasil (needs)
  # ================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-docker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file dari .env.example
        run: cp .env.example .env

      - name: Start semua services
        run: |
          docker compose up -d auth-db finance-db letter-db
          sleep 15
          docker compose up -d auth-service
          sleep 20
          docker compose up -d finance-service letters-service
          sleep 15
          docker compose up -d frontend || true
          sleep 10
          docker compose up -d gateway || true
        continue-on-error: true

      - name: Lihat status containers
        run: docker compose ps
        continue-on-error: true

      - name: Lihat logs jika ada yang gagal
        run: docker compose logs --tail=30
        continue-on-error: true

      - name: Tunggu gateway siap
        run: |
          echo "Menunggu gateway siap..."
          sleep 15
          curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost/health || echo "Gateway belum siap"
        continue-on-error: true

      - name: Cek Auth Service health
        run: curl -f http://localhost/auth/health || echo "Auth tidak siap"
        continue-on-error: true

      - name: Cek Finance Service health
        run: curl -f http://localhost/finance/health || echo "Finance tidak siap"
        continue-on-error: true

      - name: Cek Letters Service health
        run: curl -f http://localhost/letters/health || echo "Letters tidak siap"
        continue-on-error: true

      - name: Install dependensi untuk integration test
        run: pip install httpx pytest

      - name: Jalankan integration tests
        run: pytest tests/integration/ -v --tb=short
        continue-on-error: true

  # ----------------------------------------
  # tambahan: Export log semua service
  # selalu berjalan meski test gagal (if: always())
  # ----------------------------------------
      - name: Export Docker logs ke folder
        if: always()
        run: |
          mkdir -p logs
          docker compose logs --no-color auth-service    > logs/auth-service.log    2>&1 || true
          docker compose logs --no-color finance-service > logs/finance-service.log 2>&1 || true
          docker compose logs --no-color letters-service > logs/letters-service.log 2>&1 || true
          docker compose logs --no-color gateway         > logs/gateway.log         2>&1 || true
          docker compose logs --no-color                 > logs/all-services.log    2>&1 || true
          echo "=== Isi folder logs ==="
          ls -lh logs/

  # ----------------------------------------
  # tambahan: Tampilkan ringkasan error
  # langsung terlihat di console CI tanpa harus download
  # ----------------------------------------
      - name: Tampilkan ringkasan error di console CI
        if: always()
        run: |
          echo "============================================"
          echo "  RINGKASAN ERROR LOG"
          echo "============================================"
          echo ""
          echo "--- Error dari auth-service ---"
          grep '"level":"ERROR"' logs/auth-service.log    || echo "(tidak ada error)"
          echo ""
          echo "--- Error dari finance-service ---"
          grep '"level":"ERROR"' logs/finance-service.log || echo "(tidak ada error)"
          echo ""
          echo "--- Error dari letters-service ---"
          grep '"level":"ERROR"' logs/letters-service.log || echo "(tidak ada error)"
          echo ""
          echo "--- CRITICAL dari semua service ---"
          grep '"level":"CRITICAL"' logs/all-services.log || echo "(tidak ada critical)"

  # ----------------------------------------
  # tambahan: Upload log sebagai artifact
  # Log bisa didownload dari tab Actions di GitHub
  # Disimpan selama 7 hari lalu otomatis terhapus
  # ----------------------------------------
      - name: Upload logs sebagai GitHub Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7

      - name: Stop semua services dan hapus volumes
        if: always()
        run: docker compose down -v