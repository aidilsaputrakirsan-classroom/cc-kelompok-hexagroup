name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================================
  # JOB 1: Test Auth Service
  # ================================
  test-auth-service:
    name: 🔐 Test Auth Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./services/auth-service

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/auth-service/requirements.txt

      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run tests with coverage
        env:
          SECRET_KEY: "test-secret-key-for-ci-only"
          DATABASE_URL: "sqlite:///./test.db"
          TESTING: "true"
        run: pytest

  # ================================
  # JOB 2: Test Item Service
  # (otomatis skip kalau folder belum ada)
  # ================================
  test-item-service:
    name: 📦 Test Item Service
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Cek folder item-service
        id: check_item
        run: |
          if [ -d "services/item-service" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ services/item-service belum ada, di-skip"
          fi

      - name: 🐍 Setup Python
        if: steps.check_item.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📥 Install dependencies
        if: steps.check_item.outputs.exists == 'true'
        working-directory: ./services/item-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run tests with coverage
        if: steps.check_item.outputs.exists == 'true'
        working-directory: ./services/item-service
        env:
          DATABASE_URL: "sqlite:///./test.db"
          AUTH_SERVICE_URL: "http://auth-service:8001"
          TESTING: "true"
        run: pytest

  # ================================
  # JOB 3: Lint Auth Service
  # ================================
  lint-auth-service:
    name: 🔍 Lint Auth Service
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ./services/auth-service

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📥 Install ruff
        run: pip install ruff

      - name: 🔍 Run Ruff Linter
        run: ruff check .

  # ================================
  # JOB 4: Lint Item Service
  # (otomatis skip kalau folder belum ada)
  # ================================
  lint-item-service:
    name: 🔍 Lint Item Service
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Cek folder item-service
        id: check_item
        run: |
          if [ -d "services/item-service" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ services/item-service belum ada, di-skip"
          fi

      - name: 🐍 Setup Python
        if: steps.check_item.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📥 Install ruff
        if: steps.check_item.outputs.exists == 'true'
        run: pip install ruff

      - name: 🔍 Run Ruff Linter
        if: steps.check_item.outputs.exists == 'true'
        working-directory: ./services/item-service
        run: ruff check .

  # ================================
  # JOB 5: Test Frontend
  # ================================
  test-frontend:
    name: ⚛️ Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test -- --run

      - name: 🏗️ Build frontend
        run: npm run build

  # ================================
  # JOB 6: Build Docker Images
  # Jalan setelah semua test lulus
  # ================================
  build-docker:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - test-auth-service
      - test-item-service
      - lint-auth-service
      - lint-item-service
      - test-frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build auth-service image
        run: docker build -t hexagroup-auth-service:ci ./services/auth-service

      - name: 🔍 Cek folder item-service untuk build
        id: check_item
        run: |
          if [ -d "services/item-service" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 🐳 Build item-service image
        if: steps.check_item.outputs.exists == 'true'
        run: docker build -t hexagroup-item-service:ci ./services/item-service

      - name: 🐳 Build frontend image
        run: docker build -t hexagroup-frontend:ci ./frontend

      - name: ✅ Build success
        run: echo "✅ All Docker images built successfully!"