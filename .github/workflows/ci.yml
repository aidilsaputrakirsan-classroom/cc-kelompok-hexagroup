# ==============================================
# CI Pipeline — HexaGroup (Microservices)
# ==============================================
# Pipeline ini berjalan otomatis saat:
# - Push ke branch manapun
# - Pull Request ke branch main
#
# Jobs:
# 1. test-auth-service   : Pytest untuk Auth Service
# 2. test-item-service   : Pytest untuk Item Service (jika ada)
# 3. lint-auth-service   : Ruff lint Auth Service
# 4. lint-item-service   : Ruff lint Item Service (jika ada)
# 5. test-frontend       : Vitest + build frontend
# 6. build-docker        : Build semua Docker images

name: CI Pipeline

on:
  push:
    branches: ["**"]          # semua branch, bukan hanya main
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================================
  # JOB 1: Test Auth Service
  # ================================
  test-auth-service:
    name: 🔐 Test Auth Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./services/auth-service

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/auth-service/requirements.txt

      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run tests with coverage
        env:
          SECRET_KEY: "test-secret-key-for-ci-only"
          DATABASE_URL: "sqlite:///./test.db"
          TESTING: "true"
        run: pytest

  # ================================
  # JOB 2: Test Item Service
  # (Aktifkan kalau sudah ada tests-nya)
  # ================================
  test-item-service:
    name: 📦 Test Item Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./services/item-service

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/item-service/requirements.txt

      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run tests with coverage
        env:
          DATABASE_URL: "sqlite:///./test.db"
          AUTH_SERVICE_URL: "http://auth-service:8001"
          TESTING: "true"
        run: pytest

  # ================================
  # JOB 3: Lint Auth Service
  # ================================
  lint-auth-service:
    name: 🔍 Lint Auth Service
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ./services/auth-service

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📥 Install ruff
        run: pip install ruff

      - name: 🔍 Run Ruff Linter
        run: ruff check .

  # ================================
  # JOB 4: Lint Item Service
  # ================================
  lint-item-service:
    name: 🔍 Lint Item Service
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ./services/item-service

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📥 Install ruff
        run: pip install ruff

      - name: 🔍 Run Ruff Linter
        run: ruff check .

  # ================================
  # JOB 5: Test Frontend
  # ================================
  test-frontend:
    name: ⚛️ Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test -- --run

      - name: 🏗️ Build frontend
        run: npm run build

  # ================================
  # JOB 6: Build Docker Images
  # Hanya jalan kalau semua test & lint lulus
  # ================================
  build-docker:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - test-auth-service
      - test-item-service
      - lint-auth-service
      - lint-item-service
      - test-frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build auth-service image
        run: docker build -t hexagroup-auth-service:ci ./services/auth-service

      - name: 🐳 Build item-service image
        run: docker build -t hexagroup-item-service:ci ./services/item-service

      - name: 🐳 Build frontend image
        run: docker build -t hexagroup-frontend:ci ./frontend

      - name: ✅ Build success
        run: echo "✅ All Docker images built successfully!"