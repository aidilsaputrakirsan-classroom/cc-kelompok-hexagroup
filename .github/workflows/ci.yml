# ==============================================
# CI Pipeline — HexaGroup
# ==============================================
# Pipeline ini berjalan otomatis saat:
# - Push ke branch main
# - Pull Request ke branch main
#
# Jobs:
# 1. test-backend: Install deps + run pytest
# 2. test-frontend: Install deps + run vitest
# 3. lint: Ruff untuk pengecekan kualitas kode backend
# 4. build-docker: Build Docker images (pastikan Dockerfile valid)

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================================
  # JOB 1: Test Backend (Python/FastAPI)
  # ================================
  test-backend:
    name: 🐍 Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run tests with coverage
        run: pytest

  # ================================
  # JOB 2: Test Frontend (React/Vitest)
  # ================================
  test-frontend:
    name: ⚛️ Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test -- --run

      - name: 🏗️ Build frontend
        run: npm run build

  # ================================
  # JOB 3: Lint Backend (Ruff)
  # ================================
  lint:
    name: 🔍 Lint Backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📥 Install ruff
        run: pip install ruff

      - name: 🔍 Run Ruff Linter
        run: ruff check .

  # ================================
  # JOB 4: Build Docker Images
  # ================================
  build-docker:
    name: 🐳 Build Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-backend, test-frontend, lint]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build backend image
        run: docker build -t sikasi-app-backend:ci ./backend

      - name: 🐳 Build frontend image
        run: docker build -t sikasi-app-frontend:ci ./frontend

      - name: ✅ Build success
        run: echo "✅ All Docker images built successfully!"

  # ================================
  # JOB 5: Deploy ke Railway
  # ================================
  deploy:
    name: 🚀 Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, lint, build-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚂 Install Railway CLI
        run: npm install -g @railway/cli

      - name: 🚀 Deploy Backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd backend
          railway up --service backend --detach

      - name: 🚀 Deploy Frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd frontend
          railway up --service frontend --detach

      - name: 🏥 Health Check Backend
        run: |
          echo "Menunggu Railway siap (30 detik)..."
          sleep 30

          HEALTH_URL="https://cloudapp-backend-xxx.up.railway.app/health"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL)

          if [ "$HTTP_STATUS" == "200" ]; then
            echo "✅ Health check PASSED! (HTTP $HTTP_STATUS)"
          else
            echo "❌ Health check FAILED! (HTTP $HTTP_STATUS)"
            exit 1
          fi

      - name: 📋 Deployment Summary
        run: |
          echo "========================================"
          echo "       🚀 DEPLOYMENT SUMMARY"
          echo "========================================"
          echo "✅ Status      : SUCCESS"
          echo "📦 Commit SHA  : ${{ github.sha }}"
          echo "👤 Deployed by : ${{ github.actor }}"
          echo "🕐 Timestamp   : $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🌿 Branch      : ${{ github.ref_name }}"
          echo ""
          echo "🌐 PRODUCTION URLs:"
          echo "   Frontend : https://sikasi-frontend-production-5f57.up.railway.app"
          echo "   Backend  : sikasi-backend-production-a11c.up.railway.app"
          echo "   API Docs : https://sikasi-backend-production-a11c.up.railway.app/docs"
          echo "========================================"