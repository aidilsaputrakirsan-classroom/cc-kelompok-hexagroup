# ==============================================
# CI Pipeline — HexaGroup (Microservices)
# ==============================================
# Pipeline ini berjalan otomatis saat:
# - Push ke branch main
# - Pull Request ke branch main
#
# Jobs yang berjalan:
# 1. test-auth-service    : Unit test Auth Service
# 2. test-finance-service : Unit test Finance Service
# 3. test-letters-service : Unit test Letters Service
# 4. lint-services        : Cek kualitas kode semua services (Ruff)
# 5. build-docker         : Build semua Docker images
# 6. integration-test     : Test komunikasi antar services (cross-service)
# ==============================================

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Batalkan pipeline lama jika ada push baru di branch yang sama
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ================================
  # JOB 1: Unit Test Auth Service
  # ================================
  test-auth-service:
    name: Test Auth Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./services/auth-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/auth-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ================================
  # JOB 2: Unit Test Finance Service
  # ================================
  test-finance-service:
    name: Test Finance Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./services/finance-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/finance-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ================================
  # JOB 3: Unit Test Letters Service
  # ================================
  test-letters-service:
    name: Test Letters Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./services/letters-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/letters-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ================================
  # JOB 4: Lint Semua Services dengan Ruff
  # ================================
  lint-services:
    name: Lint All Services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint Auth Service
        run: ruff check ./services/auth-service

      - name: Lint Finance Service
        run: ruff check ./services/finance-service

      - name: Lint Letters Service
        run: ruff check ./services/letters-service

  # ================================
  # JOB 5: Build Docker Images
  # ================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-auth-service, test-finance-service, test-letters-service, lint-services]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Auth Service image
        run: docker build -t sikasi-auth-service:ci ./services/auth-service

      - name: Build Finance Service image
        run: docker build -t sikasi-finance-service:ci ./services/finance-service

      - name: Build Letters Service image
        run: docker build -t sikasi-letters-service:ci ./services/letters-service

      - name: Build Frontend image
        run: docker build -t sikasi-frontend:ci ./frontend

      - name: Build success
        run: echo "Semua Docker images berhasil di-build!"

  # ================================
  # JOB 6: Integration Tests
  # ================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-docker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file dari .env.example
        run: cp .env.example .env

      - name: Start semua services
        run: |
          docker compose up -d auth-db finance-db letter-db
          sleep 15
          docker compose up -d auth-service
          sleep 20
          docker compose up -d finance-service letters-service
          sleep 15
          docker compose up -d frontend
          sleep 10
          docker compose up -d gateway

      # Langkah debugging ini hanya berjalan jika langkah "Start semua services" di atas mengalami kegagalan (failure)
      - name: Lihat status containers jika gagal
        if: failure()
        run: docker compose ps

      - name: Lihat logs jika gagal
        if: failure()
        run: docker compose logs --tail=50

      - name: Tunggu gateway siap
        run: |
          echo "Menunggu gateway siap..."
          curl --retry 10 --retry-delay 5 --retry-connrefused -f http://localhost/health

      - name: Cek Auth Service health
        run: curl -f http://localhost/auth/health

      - name: Cek Finance Service health
        run: curl -f http://localhost/finance/health

      - name: Cek Letters Service health
        run: curl -f http://localhost/letters/health

      - name: Install dependensi untuk integration test
        run: pip install httpx pytest

      - name: Jalankan integration tests
        run: pytest tests/integration/ -v --tb=short

      - name: Stop semua services dan hapus volumes
        if: always()
        run: docker compose down -v
