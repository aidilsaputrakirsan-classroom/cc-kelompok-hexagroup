# ============================================================
# Docker Compose — sikasi App (Microservices)
# Komputasi Awan — SI ITK
# ============================================================
# Usage:
#   make up                        # Build & jalankan semua services
#   make down                      # Stop & remove
#   make logs                      # Lihat logs semua services
#   make restart                   # Restart semua services
#
#   Development:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
#   Production:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================

services:

  # ==================== DATABASES ====================

  auth-db:
    image: postgres:16-alpine
    container_name: sikasiapp-auth-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: auth_db
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    networks:
      - sikasinet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  finance-db:
    image: postgres:16-alpine
    container_name: sikasiapp-finance-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: finance_db
    volumes:
      - finance_pgdata:/var/lib/postgresql/data
    networks:
      - sikasinet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  letter-db:
    image: postgres:16-alpine
    container_name: sikasiapp-letter-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: letter_db
    volumes:
      - letter_pgdata:/var/lib/postgresql/data
    networks:
      - sikasinet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d letter_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ==================== BACKEND SERVICES ====================

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: sikasiapp-auth-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@auth-db:5432/auth_db
    networks:
      - sikasinet
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/auth/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  finance-service:
    build:
      context: ./services/finance-service
      dockerfile: Dockerfile
    container_name: sikasiapp-finance-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@finance-db:5432/finance_db
      AUTH_SERVICE_URL: http://auth-service:8001
    networks:
      - sikasinet
    depends_on:
      finance-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/finance/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  letters-service:
    build:
      context: ./services/letters-service
      dockerfile: Dockerfile
    container_name: sikasiapp-letters-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@letter-db:5432/letter_db
      AUTH_SERVICE_URL: http://auth-service:8001
    networks:
      - sikasinet
    depends_on:
      letter-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8003/letters/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ==================== GATEWAY ====================

  gateway:
    image: nginx:alpine
    container_name: sikasiapp-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - sikasinet
    depends_on:
      auth-service:
        condition: service_healthy
      finance-service:
        condition: service_healthy
      letters-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M

  # ==================== FRONTEND ====================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost}
    container_name: sikasiapp-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - sikasinet
    depends_on:
      gateway:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M

# ==================== VOLUMES ====================

volumes:
  auth_pgdata:
    name: sikasiapp-auth-pgdata

  finance_pgdata:
    name: sikasiapp-finance-pgdata

  letter_pgdata:
    name: sikasiapp-letter-pgdata

# ==================== NETWORKS ====================

networks:
  sikasinet:
    name: sikasiapp-network
    driver: bridge