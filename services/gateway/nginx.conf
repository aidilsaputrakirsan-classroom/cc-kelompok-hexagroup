events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server auth-service:8001;
    }

    upstream finance_service {
        server finance-service:8002;
    }

    upstream letters_service {
        server letters-service:8003;
    }

    # ==================== RATE LIMITING ====================
    # auth_limit    : 5 req/s  — Login/register (cegah brute force)
    # api_limit     : 20 req/s — CRUD operations (finance, letters)
    # general_limit : 30 req/s — Frontend & route lainnya

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    server {
        listen 80;
        server_name localhost;

        # Auth login & register — paling ketat (cegah brute force)
        location /auth/login {
            limit_req zone=auth_limit burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://auth_service/auth/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        location /auth/register {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://auth_service/auth/register;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Auth routes lainnya — sama seperti sebelumnya
        location /auth/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://auth_service/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # Finance routes
        location /finance/ {
            limit_req zone=api_limit burst=30 nodelay;
            limit_req_status 429;
            proxy_pass http://finance_service/finance/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # Letters routes
        location /letters/ {
            limit_req zone=api_limit burst=30 nodelay;
            limit_req_status 429;
            proxy_pass http://letters_service/letters/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # Health check — tanpa rate limit
        location /health {
            default_type application/json;
            return 200 '{"status": "healthy", "service": "gateway"}';
        }

        # Frontend — sama seperti sebelumnya
        location / {
            limit_req zone=general_limit burst=50 nodelay;
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Error page untuk rate limit (429)
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error": "Too many requests. Please try again later.", "status": 429}';
        }
    }
}